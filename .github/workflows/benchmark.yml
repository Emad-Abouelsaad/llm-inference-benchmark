name: LLM Benchmark

on:
  workflow_dispatch:
    inputs:
      source_model:
        description: "OpenVINO model on Hugging Face"
        default: "OpenVINO/TinyLlama-1.1B-Chat-v1.0-int4-ov"
      concurrency:
        description: "Comma-separated concurrency levels"
        default: "1,2,4,8"
      num_requests:
        description: "Requests per concurrency level"
        default: "16"
      max_tokens:
        description: "Max output tokens per request"
        default: "128"
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC, builds a performance history
  push:
    branches: [main]
    paths: ["llmbench/**", ".github/workflows/benchmark.yml"]

concurrency:
  group: benchmark
  cancel-in-progress: false

env:
  OVMS_IMAGE: openvino/model_server:2026.3
  SOURCE_MODEL: ${{ inputs.source_model || 'OpenVINO/TinyLlama-1.1B-Chat-v1.0-int4-ov' }}
  MODEL_NAME: llm
  CONCURRENCY: ${{ inputs.concurrency || '1,2,4,8' }}
  NUM_REQUESTS: ${{ inputs.num_requests || '16' }}
  MAX_TOKENS: ${{ inputs.max_tokens || '128' }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: bench
          POSTGRES_DB: bench
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bench -d bench"
          --health-interval 5s --health-retries 10
    env:
      # Set the DATABASE_URL repository secret (e.g. a free Neon/Supabase database) to keep
      # a history across runs; otherwise the job-local PostgreSQL service is used.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://bench:bench@localhost:5432/bench' }}
      EXTERNAL_DB: ${{ secrets.DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Cache OpenVINO model
        uses: actions/cache@v4
        with:
          path: models
          key: ovms-${{ env.SOURCE_MODEL }}

      - name: Start OpenVINO Model Server
        run: |
          mkdir -p models results
          docker run -d --name ovms --user "$(id -u):$(id -g)" -p 8000:8000 \
            -v "$PWD/models:/models:rw" "$OVMS_IMAGE" \
            --source_model "$SOURCE_MODEL" --model_repository_path /models \
            --model_name "$MODEL_NAME" --task text_generation \
            --target_device CPU --rest_port 8000

      - name: Run benchmark
        run: |
          python -m llmbench run \
            --base-url http://localhost:8000/v3 --model "$MODEL_NAME" --backend openvino \
            --concurrency "$CONCURRENCY" --num-requests "$NUM_REQUESTS" \
            --max-tokens "$MAX_TOKENS" --wait-timeout 1200 \
            --notes "source_model=$SOURCE_MODEL image=$OVMS_IMAGE"

      - name: Write job summary and chart
        run: |
          RUN_UUID=$(python -c "import json; print(json.load(open('results/results.json'))['run_uuid'])")
          python -m llmbench report --run-uuid "$RUN_UUID" \
            --summary-file "$GITHUB_STEP_SUMMARY" --plot results/benchmark.png
          python -m llmbench report --run-uuid "$RUN_UUID" > results/report.md

      - name: Dump database
        if: env.EXTERNAL_DB != 'true'
        run: docker exec ${{ job.services.postgres.id }} pg_dump -U bench bench > results/bench.sql

      - name: Server logs on failure
        if: failure()
        run: docker logs ovms 2>&1 | tail -200

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ github.run_id }}
          path: results/
